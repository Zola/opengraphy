services:
  app:
    build: .
    environment:
      PORT: "8080"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-https://opengraph.aston.tw}"
      REDIS_ADDR: "redis:6379"
      SQLITE_PATH: "/data/opengraphy.db"
      RATE_SALT: "${RATE_SALT:-change-me}"
      BOT_USER_AGENT: "${BOT_USER_AGENT:-OpenGraphyBot/1.0 (+https://opengraph.aston.tw/bot)}"
    volumes:
      - app-data:/data
    networks:
      internal:
      proxy:
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - internal
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      internal:
      proxy:
        aliases:
          - opengraphy-web
    depends_on:
      - app
    restart: unless-stopped

volumes:
  app-data:

networks:
  internal:
    internal: true
  proxy:
    external: true
